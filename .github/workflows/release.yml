# Build y publicar release cuando se crea un tag v*
# Ejemplo: git tag v1.0.0 && git push origin v1.0.0

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm AsusControl.spec

      - name: Create tarball
        run: |
          cd dist
          tar czvf AsusControl-${{ github.ref_name }}-linux-x86_64.tar.gz AsusControl
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AsusControl-${{ github.ref_name }}-linux-x86_64
          path: dist/AsusControl-${{ github.ref_name }}-linux-x86_64.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/AsusControl-${{ github.ref_name }}-linux-x86_64.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Build y publicar release cuando se crea un tag v*
# Ejemplo: git tag v1.0.0 && git push origin v1.0.0

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm AsusControl.spec

      - name: Build .deb package
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          VERSION=$VERSION ./build-deb.sh

      - name: Rename binary to versioned name and create tarball
        id: tarball
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          cd dist
          mv PowerAdmin-AsusStation PowerAdmin-AsusStation-${VERSION}
          tar czvf PowerAdmin-AsusStation-${VERSION}-linux-x86_64.tar.gz PowerAdmin-AsusStation-${VERSION}
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PowerAdmin-AsusStation-${{ github.ref_name }}-linux-x86_64
          path: |
            dist/PowerAdmin-AsusStation-${{ steps.tarball.outputs.version }}-linux-x86_64.tar.gz
            dist/poweradmin-asusstation_${{ steps.tarball.outputs.version }}_amd64.deb

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/PowerAdmin-AsusStation-${{ steps.tarball.outputs.version }}-linux-x86_64.tar.gz
            dist/poweradmin-asusstation_${{ steps.tarball.outputs.version }}_amd64.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
